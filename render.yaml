services:
  # -------------------------------------------------------------
  # DDCET RankRise - Express + Node.js Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: ddcet-rankrise-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: ddcet-resources

  # -------------------------------------------------------------
  # DDCET RankRise - React + Vite Frontend Static Site
  # -------------------------------------------------------------
  - type: web
    name: ddcet-rankrise-frontend
    runtime: static
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
